name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python3 -B scripts/model-trial-monitors/test_watch.py
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: npm ci --prefix bb-plugin-tenet-status
      - run: bunx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      - run: env -u BASH_ENV -u ENV /bin/bash --noprofile --norc scripts/validate-offline.sh --browser-cache "${{ runner.temp }}/playwright-browsers"

  delivery:
    name: Build installable archive
    needs: [offline]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # Build, reject contamination, relocate, install production deps and exercise all entries.
      - run: bun run package:archive
      # Python stdlib sees raw AppleDouble/PAX records that macOS tar can hide.
      - run: python3 -B scripts/check-archive-metadata.py delivery/tenet.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tenet-install-${{ github.sha }}
          path: delivery/tenet.tar.gz
          if-no-files-found: error
          retention-days: 14
