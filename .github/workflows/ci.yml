name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: python3 -B scripts/model-trial-monitors/test_watch.py
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix bb-plugin-tenet-status
      - run: bun run sdk:build
      # Pi inspector command tests load the production frontend from inspector/dist.
      - run: bun run inspector:build
      # Website content checks read the prerendered React pages.
      - run: bun run site:build
      # The typed React summary mount imports ignored generated library output.
      - run: bun run summary:build
      # Isolate node:test-based Pi smoke tests from other Bun test files.
      - run: bun test --isolate --max-concurrency=1 --timeout=30000
      - run: bun run typecheck
      - run: ./node_modules/.bin/tsc --noEmit
        working-directory: bb-plugin-tenet-status
      - run: ./node_modules/.bin/vitest run --config vitest.config.ts
        working-directory: bb-plugin-tenet-status

  inspector:
    name: Inspector and browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Browser fixtures load Pi's adapter through the compiled SDK entry.
      - run: bun run sdk:build
      # BB browser fixtures need plugin dependencies and the generated shared mount.
      - run: npm ci --prefix bb-plugin-tenet-status
      - run: bun run summary:build
      - run: bun run inspector:check
      - run: bunx playwright install --with-deps chromium
      - run: CI=1 bun run inspector:test

  delivery:
    name: Build installable archive
    needs: [guard, inspector]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Build, reject contamination, relocate, install production deps and exercise all entries.
      - run: bun run package:archive
      # Python stdlib sees raw AppleDouble/PAX records that macOS tar can hide.
      - run: python3 -B scripts/check-archive-metadata.py delivery/tenet.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tenet-install-${{ github.sha }}
          path: delivery/tenet.tar.gz
          if-no-files-found: error
          retention-days: 14
