name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix bb-plugin-tenet-status
      - run: bun run sdk:build
      # Pi inspector command tests load the production frontend from inspector/dist.
      - run: bun run inspector:build
      # Isolate node:test-based Pi smoke tests from other Bun test files.
      - run: bun test --isolate --max-concurrency=1 --timeout=30000
      - run: bun run typecheck
      - run: ./node_modules/.bin/tsc --noEmit
        working-directory: bb-plugin-tenet-status
      - run: ./node_modules/.bin/vitest run --config vitest.config.ts
        working-directory: bb-plugin-tenet-status

  inspector:
    name: Inspector and browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run inspector:check
      - run: bunx playwright install --with-deps chromium
      - run: CI=1 bun run inspector:test

  delivery:
    name: Build installable archive
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [guard, inspector]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run sdk:build
      - run: bun run inspector:build
      # No dependency tree, credentials, test recordings, or vendored design assets.
      - name: Pack local-install archive
        run: |
          mkdir -p delivery/tenet/inspector
          cp -R src docs dist delivery/tenet/
          cp package.json bun.lock LICENSE delivery/tenet/
          cp docs/INSTALL-ARCHIVE.md delivery/tenet/README.md
          cp inspector/src/fonts/OFL-Kode-Mono.txt delivery/tenet/inspector/
          cp -R inspector/dist delivery/tenet/inspector/
          tar -C delivery -czf delivery/tenet.tar.gz tenet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tenet-install-${{ github.sha }}
          path: delivery/tenet.tar.gz
          if-no-files-found: error
          retention-days: 14
