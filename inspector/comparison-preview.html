<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenet synthetic layout comparison</title>
    <style>
      body { margin: 0; padding: 16px; background: #efefed; font: 14px/1.5 system-ui, sans-serif; }
      h1 { font-size: 20px; margin: 0 0 8px; } h2.preview-label { font-size: 16px; margin: 0 0 12px; }
      .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .preview { min-width: 0; max-width: 100%; }
      @media (max-width: 820px) { .comparison { grid-template-columns: 1fr; } body { padding: 0; } }
    </style>
  </head>
  <body>
    <h1>Shared summary layout</h1>
    <p>Authored synthetic records only. Left adds standalone evidence and action previews. Right uses the summary-only mount.</p>
    <div class="comparison">
      <section><h2 class="preview-label">Standalone extensions</h2><div class="preview" id="standalone-preview"></div></section>
      <section><h2 class="preview-label">BB summary-only library</h2><div class="preview" id="embedded-preview"></div></section>
    </div>
    <script type="module" src="/src/shared/comparison-preview.ts"></script>
  </body>
</html>
