<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenet common summary comparison</title>
    <style>
      body { margin: 0; padding: 16px; background: #efefed; }
      .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
      .preview { min-width: 0; max-width: 100%; }
      .preview-label { font: 600 16px/1.5 system-ui; margin-bottom: 12px; }
      .preview-control { display: block; margin: 16px 0; }
      @media (max-width: 820px) { .comparison { grid-template-columns: 1fr; } }
      @media (max-width: 820px) { body { padding: 0; } }
    </style>
  </head>
  <body>
    <div id="comparison-preview"></div>
    <script type="module" src="/src/shared/comparison-preview.ts"></script>
  </body>
</html>
